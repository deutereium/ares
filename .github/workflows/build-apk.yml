name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

jobs:
  build:
    name: Release APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$GITHUB_WORKSPACE/release.keystore"
          } > "$GITHUB_WORKSPACE/key.properties"

      - name: Build release APK
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Verify APK
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          "$aapt" dump badging "$apk" | head -3
          sha256sum "$apk"
          ls -lh "$apk"

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: ares-symbols
          path: build/symbols
          retention-days: 14
          if-no-files-found: ignore

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          short=$(git rev-parse --short HEAD)
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          send_document() {
            curl --fail-with-body --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@$1;filename=$2" \
              -F "caption=$3"
          }
          if [ "$(stat -c%s "$apk")" -le 50000000 ]; then
            send_document "$apk" "Ares-${short}-arm64.apk" "Ares ${short} arm64 | sha256 ${sha}"
          else
            if ! command -v zstd >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq zstd
            fi
            compressed="${apk}.zst"
            zstd -q -c -3 "$apk" > "$compressed"
            send_document "$compressed" "Ares-${short}-arm64.apk.zst" "Ares ${short} arm64 (zstd compressed) | sha256 ${sha}. Decompress with: zstd -d"
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ares-release-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
